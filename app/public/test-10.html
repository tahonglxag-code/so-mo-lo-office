<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra 10 người · VP SỜ MỜ LỜ</title><style>body{font:16px system-ui;background:#eee;color:#222;padding:25px}button{padding:12px;border-radius:12px;background:#ffe9a8}pre{white-space:pre-wrap;background:white;padding:15px}</style><h1>Kiểm tra 10 người / 60 giây</h1><p>10 kết nối độc lập: làm việc, di chuyển, chat, tương tác, phát và tắt nhạc. Đây là kiểm tra đồng bộ máy chủ, không đo FPS 3D.</p><button>Bắt đầu kiểm tra</button><pre></pre><script src="/socket.io/socket.io.js"></script><script type="module">function ghi(v){document.querySelector('pre').textContent+=(typeof v==='string'?v:JSON.stringify(v,null,2))+'\n';}
document.querySelector('button').onclick=async()=>{document.querySelector('button').disabled=true;
const url=location.origin,room=`T${Date.now().toString(36)}`.slice(-10).toUpperCase(),clients=[],errors=[],events={moves:0,chat:0,act:0,impact:0,work:0,music:0};
let running=false,maxAck=0,checks=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const once=(s,n,test=()=>true)=>new Promise((resolve,reject)=>{const t=setTimeout(()=>{s.off(n,f);reject(new Error(`Timeout ${n}`));},10000);function f(v){if(!test(v))return;clearTimeout(t);s.off(n,f);resolve(v);}s.on(n,f);});
const ack=(s,n,v)=>new Promise((resolve,reject)=>{const at=Date.now(),f=(e,r)=>{maxAck=Math.max(maxAck,Date.now()-at);e?reject(e):resolve(r);};v===undefined?s.timeout(10000).emit(n,f):s.timeout(10000).emit(n,v,f);});
async function join(i){const s=io(url,{transports:['websocket'],reconnection:false});clients.push(s);s.on('urgent-meeting',e=>{if(!e.players.every(p=>p.path?.some(v=>v.x===14.5&&v.z===9.8)))errors.push('Meeting path bypassed door');});s.on('disconnect',r=>{if(running)errors.push(r);});s.on('connect_error',e=>errors.push(e.message));for(const [n,k]of [['moves','moves'],['chat','chat'],['act','act'],['act-impact','impact'],['work-state','work'],['music-state','music']])s.on(n,()=>events[k]++);await once(s,'connect');const p=once(s,'joined');const r=await ack(s,'join',{room,name:`Test ${i}`,avatar:['snake','fish','sloth','cow','leopard'][i%5]});if(!r.ok)throw new Error(JSON.stringify(r));await p;return s;}
async function work(s){const p=once(s,'work-result');s.emit('work');const r=await p;if(!r.ok)throw new Error(r.error);await wait(120);const state=once(s,'work-state',r=>r.id===s.id&&r.working);s.emit('move',{...r.seat,yaw:0});await state;}
let movement;
try{
 for(let i=0;i<60;i++){try{if((await fetch(url+'/healthz')).ok)break;}catch{}await wait(1000);}
 for(let i=0;i<5;i++)await work(await join(i));for(let i=5;i<10;i++)await join(i);const full=once(clients[5],'work-result');clients[5].emit('work');if((await full).ok)throw new Error('Sixth work seat was available');
 const start=Date.now();running=true;let step=0;
 movement=setInterval(()=>{const t=(Date.now()-start)/1000;for(let i=6;i<10;i++)clients[i].emit('move',{x:Math.sin(t+i)*6,z:Math.cos(t+i)*4,yaw:t});},110);
 while(Date.now()-start<60000){
  await Promise.all(clients.map(async(s,i)=>{const r=await ack(s,'room-check');checks++;if(!r.ok||r.players.length!==10)throw new Error(`Client ${i} count ${r.players.length}`);const seats=r.players.map(p=>p.workSeatId).filter(Boolean);if(new Set(seats).size!==seats.length)throw new Error('Duplicate seats');if(r.players.some(p=>'workTimers'in p||'idleTimer'in p))throw new Error('Private timers leaked');}));
  if(step%6===0)clients.forEach((s,i)=>s.emit('chat',`Test ${i} ${step}s`));
  if(step%4===0){clients[6].emit('act',{target:clients[7].id,action:['punch','bonk','bow','throw'][Math.floor(step/4)%4],item:'❤️'});clients[8].emit('self-action',['money','meditate','run','toilet'][Math.floor(step/4)%4]);}
  if(step===2){const r=await ack(clients[9],'music',{url:'https://www.youtube.com/watch?v=jfKfPfyJRdk',action:'play'});if(!r.ok)throw new Error('Music failed');}
  if(step===20){const state=once(clients[0],'music-state',r=>!r.videoId&&!r.playing);const r=await ack(clients[9],'music',{action:'stop'});if(!r.ok)throw new Error('Stop failed');await state;}
  if(step===30)clients[9].emit('urgent-meeting');if(step===40)for(let i=0;i<5;i++)await work(clients[i]);
  if(step%20===0)ghi(`Progress ${Math.floor((Date.now()-start)/1000)}s, 10 clients`);step++;await wait(1000);
 }
 if(errors.length||!events.moves||!events.chat||!events.impact||!events.music)throw new Error(JSON.stringify({errors,events}));
 ghi(JSON.stringify({result:'PASS_PROTOCOL',url,room,clients:10,seconds:Math.round((Date.now()-start)/1000),checks,maxAckMs:maxAck,events,errors},null,2));
}catch(e){ghi({result:'FAIL',error:e.message});}finally{running=false;clearInterval(movement);clients.forEach(s=>s.disconnect());}

};</script></html>
